name: RAG Deploy VPS

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: rag-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history for secret scanning
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v2

      - name: Scan source and locks
        uses: aquasecurity/trivy-action@v0.31.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: rag-source-sbom.spdx.json
          artifact-name: rag-source-sbom-${{ github.run_id }}.spdx.json

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rag_eval
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rag_eval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RAG_EVAL_PGVECTOR_DSN: postgresql://postgres:postgres@127.0.0.1:5432/rag_eval
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-eval.txt

      - name: Install locked evaluation dependencies
        run: |
          python -m pip install --requirement requirements-eval.txt
          python -m pip check

      - name: Validate dependency locks
        run: python scripts/check_dependency_pins.py

      - name: Syntax check
        run: python -m compileall API_RAG_NEW chunking evaluation llms scripts *.py

      - name: Unit and policy tests
        run: python -m pytest -q

      - name: Non-paid retrieval and vector-store benchmark
        run: >-
          python -m evaluation.runner
          --stores memory chroma pgvector
          --strategies vector hybrid
          --require-stores
          --check

  container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build locked runtime image
        run: |
          docker build --tag weavecarbon-rag:m3 .
          docker run --rm weavecarbon-rag:m3 python -m pip check

      - name: Scan runtime image
        uses: aquasecurity/trivy-action@v0.31.0
        with:
          image-ref: weavecarbon-rag:m3
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate container SBOM evidence
        uses: anchore/sbom-action@v0
        with:
          image: weavecarbon-rag:m3
          format: spdx-json
          output-file: rag-sbom.spdx.json
          artifact-name: rag-sbom-${{ github.run_id }}.spdx.json

      - name: Measure image, cold start and idle memory
        shell: bash
        run: |
          set -euo pipefail
          image_bytes="$(docker image inspect weavecarbon-rag:m3 --format '{{.Size}}')"
          runtime_user="$(docker image inspect weavecarbon-rag:m3 --format '{{.Config.User}}')"
          test -n "$runtime_user" && test "$runtime_user" != '0' && test "$runtime_user" != 'root'
          test "$image_bytes" -le 2306867200
          started_ms="$(date +%s%3N)"
          docker run --detach --name rag-m3 \
            --env RAG_INTERNAL_API_KEY=ci-internal-key \
            --env RAG_REQUIRE_INTERNAL_API_KEY=true \
            weavecarbon-rag:m3 >/dev/null
          trap 'docker logs rag-m3 || true; docker rm --force rag-m3 >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 120); do
            if docker exec rag-m3 python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            echo "RAG container did not become ready within 120 seconds."
            exit 1
          fi
          ready_ms="$(date +%s%3N)"
          cold_start_ms="$((ready_ms - started_ms))"
          memory_usage="$(docker stats rag-m3 --no-stream --format '{{.MemUsage}}')"
          {
            echo '### M3 RAG runtime measurements'
            echo
            echo "- Image bytes: ${image_bytes}"
            echo "- Cold start to first health response: ${cold_start_ms} ms"
            echo "- Idle memory: ${memory_usage}"
            echo "- Runtime user: ${runtime_user}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  publish:
    needs:
      - security
      - verify
      - container
    runs-on: ubuntu-latest
    timeout-minutes: 50
    if: github.event_name != 'pull_request'
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image and source
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve release
        id: release
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push immutable RAG image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          pull: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ steps.release.outputs.sha }}
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Scan immutable RAG image
        uses: aquasecurity/trivy-action@v0.31.0
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Record release evidence
        shell: bash
        run: |
          {
            echo '### RAG immutable release'
            echo
            echo '- Source: `${{ steps.release.outputs.sha }}`'
            echo '- Image: `${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}`'
            echo '- SBOM and provenance: attached OCI attestations'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs:
      - verify
      - container
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request'
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ github.token }}

    steps:
      - name: Check deploy secrets
        id: deploy_secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for var in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [[ -z "${!var:-}" ]]; then
              echo "::warning title=Missing secret::$var is not configured. Skipping deploy."
              missing=1
            fi
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - name: Fail when deploy secrets are missing
        if: steps.deploy_secrets.outputs.missing != '0'
        run: |
          echo "::error title=Missing deploy secrets::Configure DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY for the production environment."
          exit 1

      - name: Configure SSH
        id: ssh
        if: steps.deploy_secrets.outputs.missing == '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "::error title=Invalid SSH key::DEPLOY_SSH_KEY is not a valid OpenSSH private key."
            exit 1
          fi
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          if ssh-keyscan -H -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/tmp/keyscan.log && [ -s ~/.ssh/known_hosts ]; then
            chmod 644 ~/.ssh/known_hosts
            echo "reachable=1" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=VPS unreachable::Could not fetch host key from ${DEPLOY_HOST}:${DEPLOY_PORT}. Check DEPLOY_HOST/DEPLOY_PORT and that the VPS SSH port is reachable from GitHub Actions."
            cat /tmp/keyscan.log || true
            exit 1
          fi

      - name: Deploy on VPS
        if: steps.deploy_secrets.outputs.missing == '0' && steps.ssh.outputs.reachable == '1'
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          REMOTE_RAG_IMAGE="${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}"
          GHCR_TOKEN_B64="$(printf '%s' "${GHCR_TOKEN:-}" | base64 -w0)"
          ssh -T -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "RAG_IMAGE='$REMOTE_RAG_IMAGE' GHCR_USERNAME='$GHCR_USERNAME' GHCR_TOKEN_B64='$GHCR_TOKEN_B64' bash --noprofile --norc -se" <<'EOF'
          set -euo pipefail
          GHCR_TOKEN="$(printf '%s' "$GHCR_TOKEN_B64" | base64 -d)"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          cd /opt/weavecarbon/FE
          git checkout main
          git pull --ff-only origin main
          cd /opt/weavecarbon/BE_Carbon-main
          git checkout main
          git pull --ff-only origin main
          cd /opt/weavecarbon/rag
          git checkout main
          git pull --ff-only origin main
          cd /opt/weavecarbon/FE
          PREVIOUS_RAG_IMAGE="$(grep '^RAG_IMAGE=' .env.vps | cut -d= -f2- || true)"
          if grep -q '^RAG_IMAGE=' .env.vps; then
            sed -i "s|^RAG_IMAGE=.*|RAG_IMAGE=${RAG_IMAGE}|" .env.vps
          else
            printf 'RAG_IMAGE=%s\n' "$RAG_IMAGE" >> .env.vps
          fi
          export RAG_IMAGE
          if ! bash deploy/redeploy-vps.sh --rag-only; then
            echo "[deploy] RAG smoke failed; restoring previous immutable image."
            if [ -n "$PREVIOUS_RAG_IMAGE" ]; then
              sed -i "s|^RAG_IMAGE=.*|RAG_IMAGE=${PREVIOUS_RAG_IMAGE}|" .env.vps
              export RAG_IMAGE="$PREVIOUS_RAG_IMAGE"
              bash deploy/redeploy-vps.sh --rag-only
            fi
            exit 1
          fi
          printf '%s rag %s %s\n' "$(date -u +%FT%TZ)" '${{ needs.publish.outputs.sha }}' "$RAG_IMAGE" >> .deploy-history
          EOF
